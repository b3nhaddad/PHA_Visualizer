version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # hot-reload: file changes reflect immediately
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app       # hot-reload
      - /app/node_modules     # keep container node_modules isolated
    environment:
      - BACKEND_URL=http://backend:8000   # Vite proxy target inside Docker network
    depends_on:
      backend:
        condition: service_healthy
